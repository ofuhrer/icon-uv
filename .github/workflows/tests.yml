name: Tests and distributions

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra cams
      - name: Test, including the offline example
        run: uv run --no-sync pytest -q
      - name: Check generated schemas
        run: uv run --no-sync python tools/generate_schemas.py --check
      - name: CLI smoke check
        run: uv run --no-sync icon-uv --help
      - name: Build source distribution and wheel
        run: uv build --out-dir work/dist
      - name: Check packaged resources and isolated wheel
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            uv run --no-sync python tools/check_distribution.py work/dist --tag "$GITHUB_REF_NAME"
          else
            uv run --no-sync python tools/check_distribution.py work/dist
          fi
      - name: Check PyPI metadata and README rendering
        run: uv run --no-sync twine check --strict work/dist/*
      - name: Save tested distributions
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: work/dist/*
          if-no-files-found: error
