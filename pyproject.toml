[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-uv"
version = "0.1.0"
description = "UV Index forecasts from ICON weather and CAMS atmospheric composition"
readme = "README.md"
authors = [{name = "Oliver Fuhrer and contributors"}]
keywords = ["uv-index", "weather", "forecast", "icon", "cams", "meteorology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2,<2.4",
    "scipy>=1.14",
    "xarray>=2024.10",
    "netCDF4>=1.7",
    "requests>=2.32",
    "eccodes>=2.43",
    "eccodeslib>=2.43; platform_system != 'Windows'",
]

[project.optional-dependencies]
cams = ["cdsapi>=0.7"]

[project.urls]
Homepage = "https://github.com/ofuhrer/icon-uv"
Documentation = "https://github.com/ofuhrer/icon-uv#readme"
Repository = "https://github.com/ofuhrer/icon-uv"
Issues = "https://github.com/ofuhrer/icon-uv/issues"
Changelog = "https://github.com/ofuhrer/icon-uv/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "jsonschema>=4.23", "twine>=6.1"]

[project.scripts]
icon-uv = "icon_uv.cli:main"

[tool.setuptools.packages.find]
include = ["icon_uv*"]

[tool.setuptools.package-data]
icon_uv = ["data/*.npz", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
