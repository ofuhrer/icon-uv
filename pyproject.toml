[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-uv"
version = "0.1.0"
description = "Small offline ICON/CAMS UV diagnostic with explicit POI geometry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<2.4", "scipy>=1.14", "xarray>=2024.10", "netCDF4>=1.7", "requests>=2.32", "eccodes>=2.43", "eccodeslib>=2.43; platform_system != 'Windows'"]

[project.optional-dependencies]
cams = ["cdsapi>=0.7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
icon-uv = "icon_uv.cli:main"

[tool.setuptools.packages.find]
include = ["icon_uv*"]

[tool.setuptools.package-data]
icon_uv = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
